on:
  push:
    branches: [main]
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'tools/check-coverage-workflow.R'
      - '.github/workflows/test-coverage.yaml'
      - '.github/workflows/codecov-upload.yaml'
      - 'codecov.yml'
  pull_request:
    paths:
      - 'R/**'
      - 'tests/**'
      - 'DESCRIPTION'
      - 'NAMESPACE'
      - 'tools/check-coverage-workflow.R'
      - '.github/workflows/test-coverage.yaml'
      - '.github/workflows/codecov-upload.yaml'
      - 'codecov.yml'
  workflow_dispatch:

name: test-coverage

permissions:
  contents: read

concurrency:
  group: test-coverage-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-coverage:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      OPENBLAS_NUM_THREADS: 1
      OMP_NUM_THREADS: 1
      R_KEEP_PKG_SOURCE: yes
    steps:
      - uses: actions/checkout@v6
      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: release
          use-public-rspm: true
      - uses: r-lib/actions/setup-r-dependencies@v2
        with:
          extra-packages: any::covr, any::xml2, any::yaml
          needs: coverage
      - name: Check coverage workflow contract
        run: |
          stopifnot(requireNamespace("yaml", quietly = TRUE))
          source("tools/check-coverage-workflow.R")
          check_coverage_workflow()
        shell: Rscript {0}
      - name: Test coverage
        run: |
          cov <- covr::package_coverage(
            quiet = FALSE,
            clean = FALSE,
            install_path = file.path(normalizePath(Sys.getenv("RUNNER_TEMP"), winslash = "/"), "package")
          )
          print(cov)
          covr::to_cobertura(cov)
        shell: Rscript {0}
      # Only trusted main-branch pushes publish the coverage artifact.
      # Pull requests run tests but never obtain upload credentials.
      - name: Save coverage report for trusted upload
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: main-coverage
          path: cobertura.xml
          if-no-files-found: error
          retention-days: 7
      - name: Show testthat output
        if: always()
        run: |
          find '${{ runner.temp }}/package' -name 'testthat.Rout*' -exec cat '{}' \; || true
        shell: bash
      - name: Upload test results
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-test-failures
          path: ${{ runner.temp }}/package
